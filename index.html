<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pião Blade Arena 🥏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0b14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            padding: 4px 6px;
        }

        /* Controles de Cima (P1 - Ponta Cabeça) */
        .controls-top {
            transform: rotate(180deg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 4px 10px;
            opacity: 0.3;
            transition: opacity 0.3s;
            flex-shrink: 0;
        }

        .controls-top.active {
            opacity: 1;
        }

        #scoreboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: clamp(0.55rem, 2vw, 0.7rem);
            font-weight: bold;
            text-align: center;
            margin: 1px 0;
            flex-shrink: 0;
        }

        .status-bars {
            display: flex;
            gap: 10px;
            font-size: clamp(0.5rem, 1.8vw, 0.6rem);
            margin-top: 2px;
        }

        .stamina-bar-container {
            width: 70px;
            height: 5px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #444;
            display: inline-block;
            vertical-align: middle;
        }

        .stamina-fill {
            height: 100%;
            width: 100%;
            background: #00ff66;
            transition: width 0.1s;
        }

        /* Arena no Centro */
        #game-container {
            position: relative;
            width: min(65vw, 250px);
            height: min(65vw, 250px);
            background: radial-gradient(circle, #15152b 0%, #080812 80%);
            border: 4px solid #333366;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 20, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 50%;
            text-align: center;
            padding: 10px;
        }

        .screen h2 {
            font-size: clamp(0.85rem, 3vw, 1.1rem);
            margin-bottom: 3px;
            color: #ffcc00;
        }

        .screen p {
            font-size: clamp(0.5rem, 1.8vw, 0.65rem);
            color: #aaa;
            margin-bottom: 4px;
            max-width: 220px;
        }

        .emoji-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .emoji-option {
            font-size: 16px;
            background: #1f1f3a;
            border: 2px solid #333366;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .emoji-option.selected {
            border-color: #00f3ff;
            background: #2a2a5a;
        }

        .btn {
            margin: 2px;
            padding: 4px 10px;
            background: linear-gradient(45deg, #00f3ff, #0066ff);
            color: #0b0b14;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: clamp(0.6rem, 2vw, 0.75rem);
            cursor: pointer;
        }

        .btn-p2 {
            background: linear-gradient(45deg, #ff0055, #ff6600);
            color: #fff;
        }

        /* Controles de Baixo */
        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 2px 10px;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-row {
            display: flex;
            gap: 6px;
        }

        .control-btn {
            width: clamp(44px, 12vw, 54px);
            height: clamp(44px, 12vw, 54px);
            background: #1f1f3a;
            color: #00f3ff;
            border: 2px solid #333366;
            border-radius: 12px;
            font-size: clamp(18px, 5vw, 24px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .control-btn:active {
            background: #00f3ff;
            color: #0b0b14;
        }
    </style>
</head>
<body>

    <!-- Controles de Cima (P1 - Ponta Cabeça) -->
    <div class="controls-top" id="top-controls-wrapper">
        <div class="control-group">
            <div style="font-size: 0.5rem; color: #ff0055; margin-bottom: 1px;">P1 (Cima)</div>
            <div class="control-btn" id="p1-up">⬆️</div>
            <div class="control-row" style="margin: 2px 0;">
                <div class="control-btn" id="p1-left">⬅️</div>
                <div class="control-btn" id="p1-down">⬇️</div>
                <div class="control-btn" id="p1-right">➡️</div>
            </div>
        </div>
        <div style="font-size: 0.6rem; color: #ff0055; font-weight: bold;" id="battle-status-text">
            Batalha Livre
        </div>
    </div>

    <div id="scoreboard">
        <div><span id="phase-label" style="color: #ffcc00;">Fase: 1</span> | Status: <span id="match-status" style="color: #00f3ff;">Livre</span></div>
        <div style="font-size: 0.5rem; color: #888; margin-top: 1px;">Recorde Fases: <span id="high-score">1</span></div>
        <div class="status-bars">
            <div>P1 Estamina: <div class="stamina-bar-container"><div class="stamina-fill" id="stamina-p1-bar"></div></div></div>
            <div>P2 Estamina: <div class="stamina-bar-container"><div class="stamina-fill" id="stamina-p2-bar"></div></div></div>
        </div>
    </div>

    <!-- Arena no Centro da Tela -->
    <div id="game-container">
        <canvas id="arenaCanvas" width="280" height="280"></canvas>

        <div id="menu-screen" class="screen">
            <h2>Pião Blade Arena 🥏</h2>
            <p>Escolha o modo:</p>
            <div style="display: flex; gap: 6px; margin-bottom: 4px;">
                <button class="btn" onclick="setMode('cpu')">🤖 Campanha</button>
                <button class="btn btn-p2" onclick="setMode('pvp')">👥 2 Jogadores</button>
            </div>
           
            <p>Emoji P1 (Cima):</p>
            <div class="emoji-selector" id="selector-p1">
                <div class="emoji-option selected" onclick="selectEmoji(1, '🐺')">🐺</div>
                <div class="emoji-option" onclick="selectEmoji(1, '🐯')">🐯</div>
                <div class="emoji-option" onclick="selectEmoji(1, '🔥')">🔥</div>
            </div>

            <p id="p2-emoji-label">Emoji P2 (Baixo):</p>
            <div class="emoji-selector" id="selector-p2">
                <div class="emoji-option selected" onclick="selectEmoji(2, '🤖')">🤖</div>
                <div class="emoji-option" onclick="selectEmoji(2, '🐲')">🐲</div>
                <div class="emoji-option" onclick="selectEmoji(2, '⚡')">⚡</div>
            </div>
           
            <button class="btn" style="margin-top: 2px;" onclick="startGame()">Iniciar Batalha</button>
        </div>

        <div id="gameover-screen" class="screen" style="display: none;">
            <h2 id="winner-title">BATALHA ENCERRADA!</h2>
            <p id="winner-desc">O pião resistiu!</p>
            <button class="btn" onclick="nextAction()">Continuar</button>
        </div>
    </div>

    <!-- Controles de Baixo (P2 / Normal) -->
    <div class="controls-bottom">
        <div class="control-group">
            <div style="font-size: 0.5rem; color: #00ff66; margin-bottom: 1px;" id="p2-label-ui">CPU</div>
            <div class="control-btn" id="p2-up">⬆️</div>
            <div class="control-row" style="margin: 2px 0;">
                <div class="control-btn" id="p2-left">⬅️</div>
                <div class="control-btn" id="p2-down">⬇️</div>
                <div class="control-btn" id="p2-right">➡️</div>
            </div>
        </div>
        <div style="font-size: 0.6rem; color: #00ff66; font-weight: bold;">
            Arena Limpa
        </div>
    </div>

    <script>
        const canvas = document.getElementById('arenaCanvas');
        const ctx = canvas.getContext('2d');

        const menuScreen = document.getElementById('menu-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const winnerTitle = document.getElementById('winner-title');
        const winnerDesc = document.getElementById('winner-desc');
        const topControlsWrapper = document.getElementById('top-controls-wrapper');
        const p2LabelUi = document.getElementById('p2-label-ui');
        const phaseLabel = document.getElementById('phase-label');
        const matchStatusEl = document.getElementById('match-status');
        const highScoreEl = document.getElementById('high-score');

        const staminaP1Bar = document.getElementById('stamina-p1-bar');
        const staminaP2Bar = document.getElementById('stamina-p2-bar');

        const arenaCenter = { x: 140, y: 140 };
        const arenaRadius = 120;

        let gameMode = 'cpu';
        let gameRunning = false;
        let currentPhase = 1;
        let highScore = localStorage.getItem('beyblade_record') || 1;
        highScoreEl.textContent = highScore;

        let isClashing = false;

        let p1 = {
            x: 95, y: 140, vx: 0, vy: 0,
            radius: 20, emoji: '🦁',
            accel: 0.35, maxSpeed: 4.2, friction: 0.985,
            stamina: 100
        };

        let p2 = {
            x: 185, y: 140, vx: 0, vy: 0,
            radius: 20, emoji: '🤖',
            accel: 0.35, maxSpeed: 4.2, friction: 0.985,
            stamina: 100
        };

        let cpuTargetAngle = 0;
        let cpuTimer = 0;
        let sparks = [];

        function setMode(mode) {
            gameMode = mode;
            if (mode === 'pvp') {
                topControlsWrapper.classList.add('active');
                p2LabelUi.textContent = "P2 (Baixo)";
                phaseLabel.textContent = "Modo 2P";
            } else {
                topControlsWrapper.classList.remove('active');
                p2LabelUi.textContent = "CPU";
                phaseLabel.textContent = `Fase ${currentPhase}`;
            }
        }

        function selectEmoji(player, emoji) {
            if (player === 1) {
                p1.emoji = emoji;
                document.querySelectorAll('#selector-p1 .emoji-option').forEach(el => {
                    el.classList.toggle('selected', el.textContent === emoji);
                });
            } else {
                p2.emoji = emoji;
                document.querySelectorAll('#selector-p2 .emoji-option').forEach(el => {
                    el.classList.toggle('selected', el.textContent === emoji);
                });
            }
        }

        function createSparks(x, y, count = 10) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1.5;
                sparks.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ffff00' : '#ff6600'
                });
            }
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'break') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function startGame() {
            initAudio();
            currentPhase = 1;
            setupMatch();
            menuScreen.style.display = 'none';
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function setupMatch() {
            if (gameMode === 'cpu') {
                phaseLabel.textContent = `Fase ${currentPhase}`;
            } else {
                phaseLabel.textContent = "Batalha 2P";
            }

            matchStatusEl.textContent = "Livre";
            isClashing = false;

            p1.x = 90; p1.y = 140; p1.vx = 0; p1.vy = 0; p1.stamina = 100;
            p2.x = 190; p2.y = 140; p2.vx = 0; p2.vy = 0; p2.stamina = 100;
            sparks = [];
        }

        function endMatchVictory(winner) {
            gameRunning = false;
            playSound('break');
            createSparks(arenaCenter.x, arenaCenter.y, 30);
            winnerTitle.textContent = "ESTAMINA ZERADA! 💥";

            if (gameMode === 'cpu') {
                if (winner === 'p1') {
                    winnerDesc.textContent = `Você venceu a Fase ${currentPhase} esvaziando o CPU!`;
                    if (currentPhase > highScore) {
                        highScore = currentPhase;
                        localStorage.setItem('beyblade_record', highScore);
                        highScoreEl.textContent = highScore;
                    }
                } else {
                    winnerDesc.textContent = `O CPU esvaziou sua estamina! Tente novamente.`;
                    currentPhase = Math.max(1, currentPhase - 1);
                }
            } else {
                winnerDesc.textContent = `${winner === 'p1' ? 'P1' : 'P2'} venceu por esvaziar a estamina!`;
            }
            gameoverScreen.style.display = 'flex';
        }

        function bindTouch(id, keyName) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, { passive: false });
            el.addEventListener('mousedown', () => { keys[keyName] = true; });
            el.addEventListener('mouseup', () => { keys[keyName] = false; });
        }

        bindTouch('p1-up', 'arrowup');
        bindTouch('p1-down', 'arrowdown');
        bindTouch('p1-left', 'arrowleft');
        bindTouch('p1-right', 'arrowright');

        bindTouch('p2-up', 'w');
        bindTouch('p2-down', 's');
        bindTouch('p2-left', 'a');
        bindTouch('p2-right', 'd');

        function update() {
            if (!gameRunning) return;

            let speedFactorP1 = 0.5 + (p1.stamina / 200);
            let speedFactorP2 = 0.5 + (p2.stamina / 200);

            if (keys['arrowup']) p1.vy -= p1.accel * speedFactorP1;
            if (keys['arrowdown']) p1.vy += p1.accel * speedFactorP1;
            if (keys['arrowleft']) p1.vx -= p1.accel * speedFactorP1;
            if (keys['arrowright']) p1.vx += p1.accel * speedFactorP1;

            if (gameMode === 'pvp') {
                if (keys['w']) p2.vy -= p2.accel * speedFactorP2;
                if (keys['s']) p2.vy += p2.accel * speedFactorP2;
                if (keys['a']) p2.vx -= p2.accel * speedFactorP2;
                if (keys['d']) p2.vx += p2.accel * speedFactorP2;
            } else {
                cpuTimer++;
                if (cpuTimer > 25) {
                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    cpuTargetAngle = Math.atan2(dy + (Math.random()-0.5)*30, dx + (Math.random()-0.5)*30);
                    cpuTimer = 0;
                }
                p2.vx += Math.cos(cpuTargetAngle) * (p2.accel * (0.75 + (currentPhase * 0.05)) * speedFactorP2);
                p2.vy += Math.sin(cpuTargetAngle) * (p2.accel * (0.75 + (currentPhase * 0.05)) * speedFactorP2);
            }

            p1.vx *= p1.friction; p1.vy *= p1.friction;
            p2.vx *= p2.friction; p2.vy *= p2.friction;

            let speedP1 = Math.hypot(p1.vx, p1.vy);
            if (speedP1 > p1.maxSpeed * speedFactorP1) { p1.vx = (p1.vx / speedP1) * (p1.maxSpeed * speedFactorP1); p1.vy = (p1.vy / speedP1) * (p1.maxSpeed * speedFactorP1); }

            let speedP2 = Math.hypot(p2.vx, p2.vy);
            if (speedP2 > p2.maxSpeed * speedFactorP2) { p2.vx = (p2.vx / speedP2) * (p2.maxSpeed * speedFactorP2); p2.vy = (p2.vy / speedP2) * (p2.maxSpeed * speedFactorP2); }

            p1.x += p1.vx; p1.y += p1.vy;
            p2.x += p2.vx; p2.y += p2.vy;

            staminaP1Bar.style.width = Math.max(0, p1.stamina) + '%';
            staminaP2Bar.style.width = Math.max(0, p2.stamina) + '%';

            // Colisão com as bordas
            let distP1 = Math.hypot(p1.x - arenaCenter.x, p1.y - arenaCenter.y);
            if (distP1 > arenaRadius - p1.radius) {
                let angle = Math.atan2(p1.y - arenaCenter.y, p1.x - arenaCenter.x);
                p1.x = arenaCenter.x + Math.cos(angle) * (arenaRadius - p1.radius);
                p1.y = arenaCenter.y + Math.sin(angle) * (arenaRadius - p1.radius);
                p1.vx *= -0.7; p1.vy *= -0.7;
            }

            let distP2 = Math.hypot(p2.x - arenaCenter.x, p2.y - arenaCenter.y);
            if (distP2 > arenaRadius - p2.radius) {
                let angle = Math.atan2(p2.y - arenaCenter.y, p2.x - arenaCenter.x);
                p2.x = arenaCenter.x + Math.cos(angle) * (arenaRadius - p2.radius);
                p2.y = arenaCenter.y + Math.sin(angle) * (arenaRadius - p2.radius);
                p2.vx *= -0.7; p2.vy *= -0.7;
            }

            // Colisão e Sistema de Vantagem de Ataque
            let distX = p2.x - p1.x;
            let distY = p2.y - p1.y;
            let distance = Math.hypot(distX, distY);
            let minDist = p1.radius + p2.radius;

            if (distance < minDist) {
                if (!isClashing) {
                    isClashing = true;
                    matchStatusEl.textContent = "Disputa 🔥";
                    matchStatusEl.style.color = "#ff0055";
                    playSound('hit');
                    createSparks((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, 6);

                    let momP1 = Math.hypot(p1.vx, p1.vy);
                    let momP2 = Math.hypot(p2.vx, p2.vy);

                    if (momP1 > momP2 + 0.3) {
                        p2.stamina -= 6 + (momP1 * 2);
                        p1.stamina -= 2;
                    } else if (momP2 > momP1 + 0.3) {
                        p1.stamina -= 6 + (momP2 * 2);
                        p2.stamina -= 2;
                    } else {
                        p1.stamina -= 3;
                        p2.stamina -= 3;
                    }

                    if (p1.stamina <= 0) {
                        endMatchVictory('p2');
                        return;
                    }
                    if (p2.stamina <= 0) {
                        endMatchVictory('p1');
                        return;
                    }
                }

                let angle = Math.atan2(distY, distX);
                let overlap = minDist - distance;

                p1.x -= Math.cos(angle) * overlap * 0.5;
                p1.y -= Math.sin(angle) * overlap * 0.5;
                p2.x += Math.cos(angle) * overlap * 0.5;
                p2.y += Math.sin(angle) * overlap * 0.5;

                let tempVx = p1.vx;
                let tempVy = p1.vy;
                p1.vx = p2.vx * 1.1;
                p1.vy = p2.vy * 1.1;
                p2.vx = tempVx * 1.1;
                p2.vy = tempVy * 1.1;
            } else {
                if (isClashing) {
                    isClashing = false;
                    matchStatusEl.textContent = "Livre";
                    matchStatusEl.style.color = "#00f3ff";
                }
            }

            for (let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i];
                s.x += s.vx; s.y += s.vy;
                s.life -= 0.05;
                if (s.life <= 0) sparks.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(arenaCenter.x, arenaCenter.y, arenaRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Pião 1
            ctx.save();
            ctx.translate(p1.x, p1.y);
            ctx.rotate(Date.now() * 0.03);
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(0, 0, p1.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.restore();

            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p1.emoji, p1.x, p1.y);

            // Pião 2
            ctx.save();
            ctx.translate(p2.x, p2.y);
            ctx.rotate(-Date.now() * 0.03);
            ctx.fillStyle = '#00ff66';
            ctx.beginPath();
            ctx.arc(0, 0, p2.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.restore();

            ctx.fillText(p2.emoji, p2.x, p2.y);

            if (p2.stamina < 50) {
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p2.x - 8, p2.y - 8);
                ctx.lineTo(p2.x + 6, p2.y + 6);
                if (p2.stamina < 20) {
                    ctx.moveTo(p2.x + 6, p2.y - 6);
                    ctx.lineTo(p2.x - 6, p2.y + 8);
                }
                ctx.stroke();
            }

            for (let s of sparks) {
                ctx.save();
                ctx.globalAlpha = s.life;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function nextAction() {
            gameoverScreen.style.display = 'none';
            if (gameMode === 'cpu') {
                if (p1.stamina > 0) {
                    currentPhase++;
                }
                setupMatch();
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            } else {
                menuScreen.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
